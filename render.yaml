services:
  - type: web
    name: doctor-digital-twin-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWIN_ENVIRONMENT
        value: production
      - key: TWIN_DATABASE_URL
        sync: false
      - key: TWIN_GEMINI_API_KEY
        sync: false
      - key: TWIN_GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: TWIN_CORS_ALLOW_ORIGINS
        sync: false